plugins {
    id "com.android.application"
}

android {
    namespace "com.enrollmentdesk.enrollmentsms"
    compileSdk 35

    defaultConfig {
        applicationId "com.enrollmentdesk.enrollmentsms"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Keep Robolectric's download lock/cache inside the build directory.
            def testHome = layout.buildDirectory.dir("test-home").get().asFile
            systemProperty "user.home", testHome.absolutePath
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
            doFirst { testHome.mkdirs() }
        }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.10.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}

// Pin resolved transitive versions as well as direct dependency versions.
dependencyLocking { lockAllConfigurations() }
